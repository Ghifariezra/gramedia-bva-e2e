name: auto-assign

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  assign-author:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Assign issue to its author
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          AUTHOR: ${{ github.event.issue.user.login }}
        run: gh issue edit "$ISSUE" --repo "$REPO" --add-assignee "$AUTHOR"

  claim-command:
    if: >-
      github.event_name == 'issue_comment' &&
      !github.event.issue.pull_request &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Handle claim and unclaim commands
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENTER: ${{ github.event.comment.user.login }}
          BODY: ${{ github.event.comment.body }}
        run: |
          command="$(printf '%s' "$BODY" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          case "$command" in
            claim|/claim|/assign)
              gh issue edit "$ISSUE" --repo "$REPO" --add-assignee "$COMMENTER"
              ;;
            unclaim|/unclaim|/unassign)
              gh issue edit "$ISSUE" --repo "$REPO" --remove-assignee "$COMMENTER"
              ;;
            *)
              echo "Not an assignment command, skipping."
              exit 0
              ;;
          esac
          gh api --method POST "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content='+1' > /dev/null