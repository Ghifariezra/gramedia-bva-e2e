name: auto-assign

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  assign-author:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Assign issue to its author
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          AUTHOR: ${{ github.event.issue.user.login }}
        run: gh issue edit "$ISSUE" --repo "$REPO" --add-assignee "$AUTHOR"

  assign-command:
    if: >-
      github.event_name == 'issue_comment' &&
      !github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - name: Handle /assign and /unassign
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          COMMENTER: ${{ github.event.comment.user.login }}
          BODY: ${{ github.event.comment.body }}
        run: |
          command="$(printf '%s' "$BODY" | tr -d '[:space:]')"
          case "$command" in
            /assign)
              gh issue edit "$ISSUE" --repo "$REPO" --add-assignee "$COMMENTER"
              ;;
            /unassign)
              gh issue edit "$ISSUE" --repo "$REPO" --remove-assignee "$COMMENTER"
              ;;
            *)
              echo "Not an assignment command, skipping."
              ;;
          esac